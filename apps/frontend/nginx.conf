# Nginx sirve la SPA y proxea /api hacia el backend (reverse proxy).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas a la API se redirigen al servicio backend de docker-compose.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: cualquier ruta desconocida cae en index.html (routing del lado del cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
